<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Siri ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* =====================================
           HOME PAGE
        ===================================== */

        #home {
            height: 100vh;
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff0f6,
                    #ffd1e8
                );

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            text-align: center;
        }


        #home h1 {
            color: #d81b60;

            font-size: 42px;

            margin-bottom: 30px;

            animation: floating 2s infinite ease-in-out;
        }


        #openButton {
            padding: 15px 35px;

            background: #ff4081;

            color: white;

            border: none;

            border-radius: 30px;

            font-size: 20px;

            cursor: pointer;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);

            animation: pulse 1.5s infinite;

            transition: 0.3s;
        }


        #openButton:hover {
            transform: scale(1.1);

            background: #e91e63;
        }



        /* =====================================
           SORRY PAGE
        ===================================== */

        #sorryPage {
            display: none;

            height: 100vh;
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #ffb6d5,
                    #ffe6f0,
                    #ffc1dc
                );

            position: relative;

            overflow: hidden;

            justify-content: center;
            align-items: center;

            flex-direction: column;

            text-align: center;
        }


        #mainContent {
            position: relative;

            z-index: 10;

            padding: 25px;

            max-width: 850px;

            width: 100%;

            animation: fadeIn 1.5s;
        }


        #sorryPage h1 {
            color: #c2185b;

            font-size: 40px;

            margin-bottom: 25px;

            animation:
                floating 3s infinite ease-in-out;
        }


        #typing {
            font-size: 30px;

            color: #880e4f;

            min-height: 50px;

            font-weight: bold;
        }


        #forgive {
            display: none;

            font-size: 27px;

            color: #ad1457;

            margin-top: 25px;

            animation: fadeIn 2s;
        }



        /* =====================================
           QUESTION
        ===================================== */

        #question {
            display: none;

            margin-top: 35px;

            font-size: 30px;

            color: #880e4f;

            font-weight: bold;

            animation: questionAppear 1s;
        }



        /* =====================================
           DIALOGUE
        ===================================== */

        #dialogue {
            display: none;

            margin-top: 30px;

            min-height: 65px;

            padding: 0 15px;

            font-size: 36px;

            line-height: 1.4;

            color: #ad1457;

            font-weight: bold;

            text-shadow:
                0 3px 10px
                rgba(173, 20, 87, 0.2);

            opacity: 1;

            transform: translateY(0);
        }


        /* Ash disappearing effect */

        #dialogue.ash {

            animation:
                ashDisappear 1s
                ease-in forwards;
        }


        @keyframes ashDisappear {

            0% {
                opacity: 1;

                filter: blur(0);

                transform:
                    translateY(0)
                    scale(1);

                letter-spacing: 0;
            }

            30% {
                opacity: 0.8;

                filter: blur(1px);

                transform:
                    translateY(-5px)
                    scale(1.02);

                letter-spacing: 2px;
            }

            60% {
                opacity: 0.35;

                filter: blur(4px);

                transform:
                    translateY(-18px)
                    scale(1.06);

                letter-spacing: 5px;
            }

            100% {
                opacity: 0;

                filter: blur(10px);

                transform:
                    translateY(-45px)
                    scale(1.15);

                letter-spacing: 12px;
            }
        }



        /* New dialogue appearing */

        #dialogue.show {

            animation:
                dialogueAppear 0.8s
                ease-out forwards;
        }


        @keyframes dialogueAppear {

            0% {
                opacity: 0;

                filter: blur(8px);

                transform:
                    translateY(20px)
                    scale(0.9);
            }

            100% {
                opacity: 1;

                filter: blur(0);

                transform:
                    translateY(0)
                    scale(1);
            }
        }



        /* =====================================
           ASH PARTICLES
        ===================================== */

        .ashParticle {

            position: absolute;

            pointer-events: none;

            z-index: 20;

            font-size: 10px;

            animation:
                ashFloat
                1.1s
                ease-out
                forwards;
        }


        @keyframes ashFloat {

            0% {
                opacity: 1;

                transform:
                    translate(0, 0)
                    scale(1)
                    rotate(0deg);
            }

            40% {
                opacity: 0.7;
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        var(--moveX),
                        var(--moveY)
                    )
                    scale(0.2)
                    rotate(360deg);
            }
        }



        /* =====================================
           BUTTON AREA
        ===================================== */

        #buttonArea {

            display: none;

            margin-top: 30px;

            justify-content: center;

            align-items: center;

            gap: 25px;

            position: relative;

            min-height: 80px;
        }


        .answerButton {

            padding: 14px 35px;

            border: none;

            border-radius: 30px;

            font-size: 20px;

            cursor: pointer;

            transition:
                all 0.6s ease;

            font-weight: bold;
        }


        /* YES */

        #yesButton {

            background: #e91e63;

            color: white;

            box-shadow:
                0 5px 20px
                rgba(233, 30, 99, 0.4);

            animation:
                pulse 1.5s infinite;
        }


        #yesButton:hover {
            transform: scale(1.12);
        }


        /* NO */

        #noButton {

            background: white;

            color: #e91e63;

            border:
                2px solid #e91e63;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            transform-origin: center;
        }



        /* =====================================
           CELEBRATION
        ===================================== */

        #celebration {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                linear-gradient(
                    135deg,
                    #ffb6d5,
                    #ffdff0,
                    #ffb0d2
                );

            justify-content: center;

            align-items: center;

            flex-direction: column;

            text-align: center;

            overflow: hidden;
        }


        #celebration h1 {

            font-size: 50px;

            color: #d81b60;

            animation:
                celebrationPop 1s ease,
                floating 2s infinite
                ease-in-out;

            z-index: 110;
        }


        #celebration p {

            font-size: 28px;

            color: #880e4f;

            margin-top: 20px;

            max-width: 700px;

            padding: 0 20px;

            animation:
                fadeIn 2s;

            z-index: 110;
        }


        #continueButton {

            margin-top: 35px;

            padding: 16px 35px;

            border: none;

            border-radius: 30px;

            background: #e91e63;

            color: white;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.2);

            animation:
                pulse 1.5s infinite;

            z-index: 110;
        }



        /* =====================================
           FALLING HEARTS
        ===================================== */

        .heart {

            position: absolute;

            top: -50px;

            font-size: 25px;

            animation:
                fall linear forwards;

            pointer-events: none;

            z-index: 2;
        }


        @keyframes fall {

            from {

                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 1;
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }



        /* =====================================
           HEART EXPLOSION
        ===================================== */

        .explosionHeart {

            position: absolute;

            left: 50%;

            top: 50%;

            font-size: 35px;

            pointer-events: none;

            animation:
                explode 2s
                ease-out
                forwards;

            z-index: 105;
        }


        @keyframes explode {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0);

                opacity: 1;
            }

            100% {

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }
        }



        /* =====================================
           CONFETTI
        ===================================== */

        .confetti {

            position: absolute;

            width: 10px;

            height: 18px;

            top: -30px;

            animation:
                confettiFall
                3s
                linear
                forwards;

            z-index: 101;
        }


        @keyframes confettiFall {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }



        /* =====================================
           SPARKLES
        ===================================== */

        .sparkle {

            position: absolute;

            font-size: 25px;

            pointer-events: none;

            animation:
                sparkleAnimation
                2s
                ease-out
                forwards;

            z-index: 106;
        }


        @keyframes sparkleAnimation {

            0% {

                transform:
                    scale(0);

                opacity: 1;
            }

            50% {

                transform:
                    scale(2);

                opacity: 1;
            }

            100% {

                transform:
                    scale(0);

                opacity: 0;
            }
        }



        /* =====================================
           GENERAL ANIMATIONS
        ===================================== */

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }


        @keyframes floating {

            0% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-10px);
            }

            100% {
                transform:
                    translateY(0);
            }
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes questionAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.7);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes celebrationPop {

            0% {

                transform:
                    scale(0);

                opacity: 0;
            }

            70% {

                transform:
                    scale(1.2);

                opacity: 1;
            }

            100% {

                transform:
                    scale(1);
            }
        }



        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            #home h1 {
                font-size: 32px;
            }


            #sorryPage h1 {
                font-size: 28px;
            }


            #typing {
                font-size: 23px;
            }


            #forgive {
                font-size: 22px;
            }


            #question {
                font-size: 24px;
            }


            #dialogue {
                font-size: 27px;

                padding:
                    0 10px;
            }


            .answerButton {

                padding:
                    12px 25px;

                font-size: 18px;
            }


            #celebration h1 {
                font-size: 38px;
            }


            #celebration p {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         HOME
    ===================================== -->

    <div id="home">

        <h1>
            💌 Hey Siri...
        </h1>


        <button
            id="openButton"
            onclick="openSorry()">

            Click Here ❤️

        </button>

    </div>



    <!-- =====================================
         SORRY PAGE
    ===================================== -->

    <div id="sorryPage">

        <div id="mainContent">

            <h1>
                🥺 Nittu has something to say...
            </h1>


            <div id="typing"></div>


            <div id="forgive">

                Please forgive me ra Siri 🥹❤️

            </div>


            <div id="question">

                Are you still angry on me? 🥺

            </div>


            <div id="dialogue"></div>


            <div id="buttonArea">

                <button
                    id="yesButton"
                    class="answerButton"
                    onclick="yesClicked()">

                    YES ❤️

                </button>


                <button
                    id="noButton"
                    class="answerButton"
                    onclick="noClicked()">

                    NO 🥺

                </button>

            </div>

        </div>

    </div>



    <!-- =====================================
         CELEBRATION
    ===================================== -->

    <div id="celebration">

        <h1>
            YAYYYYY! 🥹❤️
        </h1>


        <p id="celebrationText">

            I knew you'd forgive me, Siri! 🫶❤️

        </p>


        <button
            id="continueButton"
            onclick="openForm()">

            One Last Thing... 💌

        </button>

    </div>



    <script>


        /* =====================================
           OPEN SORRY PAGE
        ===================================== */

        function openSorry() {

            document.getElementById("home")
                .style.display = "none";


            document.getElementById("sorryPage")
                .style.display = "flex";


            startHearts();

            startTyping();

        }



        /* =====================================
           TYPING
        ===================================== */

        const text =
            "Nittu, I am so sorry ❤️🥺";

        let index = 0;


        function startTyping() {

            const typing =
                document.getElementById("typing");


            function type() {

                if (index < text.length) {

                    typing.innerHTML +=
                        text.charAt(index);

                    index++;

                    setTimeout(
                        type,
                        100
                    );

                }

                else {

                    setTimeout(() => {

                        document.getElementById(
                            "forgive"
                        ).style.display =
                            "block";


                        setTimeout(() => {

                            document.getElementById(
                                "question"
                            ).style.display =
                                "block";


                            setTimeout(() => {

                                document.getElementById(
                                    "buttonArea"
                                ).style.display =
                                    "flex";

                            }, 1000);

                        }, 1500);

                    }, 700);

                }

            }


            type();

        }



        /* =====================================
           FALLING HEARTS
        ===================================== */

        function createHeart() {

            const heart =
                document.createElement("div");


            heart.classList.add(
                "heart"
            );


            const hearts = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💓",
                "💘",
                "💝",
                "💞"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                Math.random() *
                100 +
                "vw";


            heart.style.animationDuration =
                (Math.random() * 3 + 3) +
                "s";


            heart.style.fontSize =
                (Math.random() * 20 + 20) +
                "px";


            document
                .getElementById(
                    "sorryPage"
                )
                .appendChild(
                    heart
                );


            setTimeout(() => {

                heart.remove();

            }, 6000);

        }


        let heartInterval;


        function startHearts() {

            if (!heartInterval) {

                heartInterval =
                    setInterval(
                        createHeart,
                        250
                    );

            }

        }



        /* =====================================
           NO BUTTON
        ===================================== */

        let noCount = 0;


        function noClicked() {

            noCount++;


            const noButton =
                document.getElementById(
                    "noButton"
                );


            const dialogue =
                document.getElementById(
                    "dialogue"
                );


            /*
                First make the current
                dialogue disappear like ash.
            */

            if (
                dialogue.style.display ===
                "block"
            ) {

                createAshParticles();

                dialogue.classList.remove(
                    "show"
                );

                dialogue.classList.add(
                    "ash"
                );

            }


            /*
                Wait for ash animation,
                then show next dialogue.
            */

            setTimeout(() => {

                dialogue.classList.remove(
                    "ash"
                );


                /* =========================
                   FIRST NO
                ========================= */

                if (noCount === 1) {

                    dialogue.innerHTML =
                        "Siri endhuku anta kopam na meda? 🥺❤️";


                    showDialogue();

                    shrinkNoButton(
                        0.80
                    );

                }


                /* =========================
                   SECOND NO
                ========================= */

                else if (noCount === 2) {

                    dialogue.innerHTML =
                        "Inka kopam lo unnav aa? 😭❤️";


                    showDialogue();

                    shrinkNoButton(
                        0.60
                    );

                }


                /* =========================
                   THIRD NO
                ========================= */

                else if (noCount === 3) {

                    dialogue.innerHTML =
                        "Please ra Siri... 🥹❤️";


                    showDialogue();

                    shrinkNoButton(
                        0.40
                    );

                }


                /* =========================
                   FOURTH NO
                ========================= */

                else if (noCount === 4) {

                    dialogue.innerHTML =
                        "Siri 😭 last chance please...";


                    showDialogue();

                    shrinkNoButton(
                        0.20
                    );

                }


                /* =========================
                   FIFTH NO
                ========================= */

                else if (noCount === 5) {

                    dialogue.innerHTML =
                        "Okay... now you can't escape me 😂❤️";


                    showDialogue();


                    noButton.style.transform =
                        "scale(0)";


                    noButton.style.opacity =
                        "0";


                    setTimeout(() => {

                        noButton.style.display =
                            "none";


                        /*
                            Ash away the
                            previous sentence
                        */

                        createAshParticles();


                        dialogue.classList.remove(
                            "show"
                        );

                        dialogue.classList.add(
                            "ash"
                        );


                        setTimeout(() => {

                            dialogue.classList.remove(
                                "ash"
                            );


                            dialogue.innerHTML =
                                "Now you only have one choice 😌❤️";


                            dialogue.style.display =
                                "block";


                            dialogue.classList.add(
                                "show"
                            );


                        }, 900);

                    }, 1800);

                }

            }, 1000);

        }



        /* =====================================
           SHOW DIALOGUE
        ===================================== */

        function showDialogue() {

            const dialogue =
                document.getElementById(
                    "dialogue"
                );


            dialogue.style.display =
                "block";


            dialogue.style.opacity =
                "0";


            dialogue.style.transform =
                "translateY(20px)";


            dialogue.classList.remove(
                "ash"
            );


            dialogue.classList.remove(
                "show"
            );


            void dialogue.offsetWidth;


            dialogue.classList.add(
                "show"
            );

        }



        /* =====================================
           SHRINK NO
        ===================================== */

        function shrinkNoButton(
            scale
        ) {

            const noButton =
                document.getElementById(
                    "noButton"
                );


            noButton.style.transform =
                `scale(${scale})`;

        }



        /* =====================================
           ASH PARTICLES
        ===================================== */

        function createAshParticles() {

            const dialogue =
                document.getElementById(
                    "dialogue"
                );


            const rect =
                dialogue.getBoundingClientRect();


            const symbols = [
                "•",
                "·",
                "✦",
                "✧",
                "⋅",
                "▪"
            ];


            for (
                let i = 0;
                i < 35;
                i++
            ) {

                const ash =
                    document.createElement(
                        "div"
                    );


                ash.classList.add(
                    "ashParticle"
                );


                ash.innerHTML =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                ash.style.left =
                    (
                        rect.left +
                        Math.random() *
                        rect.width
                    ) +
                    "px";


                ash.style.top =
                    (
                        rect.top +
                        Math.random() *
                        rect.height
                    ) +
                    "px";


                ash.style.setProperty(
                    "--moveX",
                    (
                        Math.random() * 160 -
                        80
                    ) +
                    "px"
                );


                ash.style.setProperty(
                    "--moveY",
                    (
                        Math.random() * -100 -
                        20
                    ) +
                    "px"
                );


                document.body.appendChild(
                    ash
                );


                setTimeout(() => {

                    ash.remove();

                }, 1200);

            }

        }



        /* =====================================
           YES BUTTON
        ===================================== */

        function yesClicked() {

            createHeartExplosion();

            createConfetti();

            createSparkles();


            document.getElementById(
                "sorryPage"
            ).style.display =
                "none";


            document.getElementById(
                "celebration"
            ).style.display =
                "flex";


            setTimeout(() => {

                document.getElementById(
                    "celebrationText"
                ).innerHTML =
                    "Thank you Siri 🥹❤️<br><br>" +
                    "You mean so much to me 🫶";

            }, 2500);

        }



        /* =====================================
           HEART EXPLOSION
        ===================================== */

        function createHeartExplosion() {

            const emojis = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💓",
                "💘",
                "💝",
                "🫶",
                "🥹"

            ];


            for (
                let i = 0;
                i < 60;
                i++
            ) {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.classList.add(
                    "explosionHeart"
                );


                heart.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];


                const x =
                    (
                        Math.random() *
                        1000 -
                        500
                    ) +
                    "px";


                const y =
                    (
                        Math.random() *
                        1000 -
                        500
                    ) +
                    "px";


                heart.style.setProperty(
                    "--x",
                    x
                );


                heart.style.setProperty(
                    "--y",
                    y
                );


                document
                    .getElementById(
                        "celebration"
                    )
                    .appendChild(
                        heart
                    );


                setTimeout(() => {

                    heart.remove();

                }, 2200);

            }

        }



        /* =====================================
           CONFETTI
        ===================================== */

        function createConfetti() {

            for (
                let i = 0;
                i < 120;
                i++
            ) {

                const confetti =
                    document.createElement(
                        "div"
                    );


                confetti.classList.add(
                    "confetti"
                );


                confetti.style.left =
                    Math.random() *
                    100 +
                    "vw";


                confetti.style.animationDelay =
                    Math.random() *
                    1.5 +
                    "s";


                confetti.style.backgroundColor =
                    [
                        "#ff4081",
                        "#e91e63",
                        "#ff80ab",
                        "#f50057",
                        "#ff1744",
                        "#ffb6c1"
                    ][
                        Math.floor(
                            Math.random() * 6
                        )
                    ];


                document
                    .getElementById(
                        "celebration"
                    )
                    .appendChild(
                        confetti
                    );


                setTimeout(() => {

                    confetti.remove();

                }, 4500);

            }

        }



        /* =====================================
           SPARKLES
        ===================================== */

        function createSparkles() {

            const sparkleSymbols = [

                "✨",
                "⭐",
                "💫",
                "🌟"

            ];


            for (
                let i = 0;
                i < 40;
                i++
            ) {

                const sparkle =
                    document.createElement(
                        "div"
                    );


                sparkle.classList.add(
                    "sparkle"
                );


                sparkle.innerHTML =
                    sparkleSymbols[
                        Math.floor(
                            Math.random() *
                            sparkleSymbols.length
                        )
                    ];


                sparkle.style.left =
                    Math.random() *
                    100 +
                    "vw";


                sparkle.style.top =
                    Math.random() *
                    100 +
                    "vh";


                sparkle.style.animationDelay =
                    Math.random() *
                    2 +
                    "s";


                document
                    .getElementById(
                        "celebration"
                    )
                    .appendChild(
                        sparkle
                    );


                setTimeout(() => {

                    sparkle.remove();

                }, 3500);

            }

        }
